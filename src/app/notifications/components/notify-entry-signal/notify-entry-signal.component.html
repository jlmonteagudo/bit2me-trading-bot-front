<div class="box">
    <div class="box-header">
        <div class="box-title">Notify Entry Signals</div>
    </div>
    <div class="box-body">

        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="notifyEntrySignal"
                [ngModel]="notifyEntrySignal" (ngModelChange)="toggleNotifyEntrySignal($event)">

            <label class="form-check-label" for="notifyEntrySignal">
                Enable
            </label>
        </div>
    </div>
</div>
